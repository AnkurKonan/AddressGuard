[project]
name = "addressguard-api"
version = "1.1.0"
description = "Address field cleanup, completeness checks, and India PIN → state/district matching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "indian-pincode>=2.0,<3.0",
]
[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false
